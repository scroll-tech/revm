[workspace]
members = [
    "bins/revme",
    "bins/revm-test",
    "crates/revm",
    "crates/primitives",
    "crates/interpreter",
    "crates/precompile",
]
resolver = "2"
default-members = ["crates/revm"]

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.dependencies]
# openvm
openvm = { git = "https://github.com/openvm-org/openvm.git", rev = "6169765" }
openvm-ecc-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "6169765" }
openvm-pairing-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "6169765" }
openvm-keccak256-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "6169765" }
openvm-sha256-guest = { git = "https://github.com/openvm-org/openvm.git", rev = "6169765" }

[profile.release]
lto = true
codegen-units = 1
debug = true

[profile.ethtests]
inherits = "test"
opt-level = 3

[patch.crates-io]
ff = { git = "https://github.com/scroll-tech/ff", branch = "feat/sp1" }

alloy-eips = { git = "https://github.com/scroll-tech/alloy.git", branch = "v0.7.3" }

alloy-eip2930 = { git = "https://github.com/scroll-tech/alloy-eips", branch = "v0.4.2" }
alloy-eip7702 = { git = "https://github.com/scroll-tech/alloy-eips", branch = "v0.4.2" }

alloy-primitives = { git = "https://github.com/scroll-tech/alloy-core", branch = "v0.8.18-euclid-upgrade" }
alloy-sol-types = { git = "https://github.com/scroll-tech/alloy-core", branch = "v0.8.18-euclid-upgrade" }
